# The full sandbox: every optional block of the spec is populated, so every
# self-guarding section of the drawer renders and the list shows an image, a
# node and an address. Its status is injected by cluster-up.sh.
#
# gpuProfileRef is the NATIVE SwiftGPU backend. It cannot be combined with
# gpuResourceClaim (the DRA backend) or with poolRef: the documented webhook
# rules make all three mutually exclusive, so no fixture may carry more than
# one of them. The DRA branch is therefore covered by unit tests only, which is
# a deliberate gap (SPEC-0008).
apiVersion: sandbox.kubeswift.io/v1alpha1
kind: SwiftSandbox
metadata:
  name: e2e-sandbox-running
  namespace: kubeswift-e2e
  labels:
    app.kubernetes.io/part-of: freelens-kubeswift-e2e
spec:
  # A digest reference, which is what the schema says to prefer and what makes
  # the Image cell long enough to need its tooltip.
  image: ghcr.io/freelensapp/kubeswift-e2e/sandbox@sha256:3f7a1c9e5b2d84a06c1e9f7b3d5a2c8e40b6d9f1a3c7e5b8d2f4a6c0e8b1d3f5
  cpu: 2
  memory: 1Gi
  command:
    - /usr/bin/python3
  args:
    - -c
    - print("hello from the sandbox")
  workingDir: /workspace
  env:
    - name: SANDBOX_MODE
      value: interpreter
    - name: API_TOKEN
      valueFrom:
        secretKeyRef:
          name: e2e-sandbox-registry
          key: token
    - name: MODEL_NAME
      valueFrom:
        configMapKeyRef:
          name: e2e-sandbox-config
          key: model
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  timeout: 30m
  ttl: 1h
  rootfsMode: block
  # The v0.18.0 network (SPEC-0019 T2): two named ports, three ingress sources
  # (one of each shape the create form writes) and two egress rules, one per
  # destination kind. The Service is resolved by a controller that does not run
  # here; the injected status.network.egressAllowed carries what one would
  # write.
  network:
    mode: restricted
    ports:
      - name: http
        port: 8080
      - name: metrics
        port: 9090
    ingress:
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kubeswift-e2e
        - ipBlock:
            cidr: 10.0.0.0/8
            except:
              - 10.96.0.0/12
        - podSelector:
            matchLabels:
              app: e2e-sandbox-client
    egress:
      allow:
        - service:
            name: e2e-sandbox-db
          ports:
            - port: 5432
        - cidr: 10.20.0.0/24
          ports:
            - port: 53
              protocol: UDP
  # Both probes, each of the two supported actions, one by port name and one by
  # number.
  readinessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 2
    periodSeconds: 5
  livenessProbe:
    tcpSocket:
      port: 8080
    periodSeconds: 15
    failureThreshold: 4
  termination:
    drainPeriod: 20s
  # A required artifact pinned by digest, verified and governed by
  # e2e-policy-signed (225-artifact-placements.yaml), and an optional one by
  # tag that the injected status reports Skipped.
  artifacts:
    - name: plugins
      ref: ghcr.io/freelensapp/kubeswift-e2e/plugins@sha256:5d2a8f1c7e4b9036a1d8c5f2e7b4a9d03c6e1f8b5a2d7c4e9f1b6a3d8c5e2f7a
      mountPath: /opt/plugins
      pullSecretRef:
        name: e2e-sandbox-registry
      verifyKeySecretRef:
        name: e2e-sandbox-cosign
      claims:
        tier: prod
      requirePlatformVerification: true
    - name: cache
      ref: ghcr.io/freelensapp/kubeswift-e2e/cache:latest
      mountPath: /var/cache/app
      layout: unpacked
      optional: true
      fetchTimeout: 30s
  # Two Secrets written as files: modes are decimal in the object (0440 is 288,
  # 0444 is 292), which the drawer shows in octal.
  secretFiles:
    - secretName: e2e-sandbox-registry
      mode: 288
      items:
        - key: token
          path: /etc/app/token
    - secretName: e2e-sandbox-cosign
      optional: true
      items:
        - key: cosign.pub
          path: /etc/app/cosign.pub
          mode: 292
  podMetadata:
    labels:
      app: e2e-sandbox-web
  nodeSelector:
    kubeswift.io/kernel: "true"
  kernelProfileRef:
    name: e2e-kernel-6-12
  imagePullSecret: e2e-sandbox-registry
  verifyKeySecretRef:
    name: e2e-sandbox-cosign
  scratchDisk:
    blank:
      size: 100Gi
      storageClassName: standard
      volumeMode: Block
  model:
    imageRef: ghcr.io/freelensapp/kubeswift-e2e/model@sha256:9c4e2a7f1b8d3506e2a9c7f4b1d8e3a05c6b9d2f7a4e1c8b5d2f9a6c3e0b7d4a
    mountPath: /model
  gpuProfileRef:
    name: e2e-gpu-profile-pcie
---
# The minimal sandbox: nothing but the two required fields, plus the network
# mode that makes the absent address a choice rather than a gap. Every optional
# section of the drawer must guard itself away on this one, and its IP cell must
# read "None" rather than "N/A".
#
# Its injected status is the failure branch: a non-zero exit code, a terminal
# timestamp, a status.message the Status column shows verbatim, and a False
# condition.
apiVersion: sandbox.kubeswift.io/v1alpha1
kind: SwiftSandbox
metadata:
  name: e2e-sandbox-failed
  namespace: kubeswift-e2e
  labels:
    app.kubernetes.io/part-of: freelens-kubeswift-e2e
spec:
  image: ghcr.io/freelensapp/kubeswift-e2e/sandbox:broken
  memory: 512Mi
  network:
    mode: none
---
# The pooled sandbox: satisfied from a warm SwiftSandboxPool instead of the cold
# materialize+boot path. No GPU and no scratch disk, because a GPU sandbox
# always boots cold and cannot name a pool.
#
# Its injected status.podRef names the CLAIMED SLOT's pod
# (e2e-sandbox-pool-slot-1), not a pod named after the sandbox: that is what a
# checkout actually produces, and this is the one fixture that pins the fact.
# Its phase is Completed with exit code 0 and both timestamps, so the drawer's
# derived Duration row is exercised.
#
# The pool it points at is e2e-sandbox-pool in 140-swiftsandboxpools.yaml, whose
# image and slot shape are this sandbox's: a claiming SwiftSandbox must match
# them, so the pair describes a checkout that could really happen. It is what
# makes the drawer's Pool row a live link and what fills the pool drawer's
# "Sandboxes Using This Pool" table.
apiVersion: sandbox.kubeswift.io/v1alpha1
kind: SwiftSandbox
metadata:
  name: e2e-sandbox-pooled
  namespace: kubeswift-e2e
  labels:
    app.kubernetes.io/part-of: freelens-kubeswift-e2e
spec:
  image: ghcr.io/freelensapp/kubeswift-e2e/sandbox:warm
  memory: 512Mi
  command:
    - /usr/bin/env
  poolRef:
    name: e2e-sandbox-pool
  network:
    mode: restricted
