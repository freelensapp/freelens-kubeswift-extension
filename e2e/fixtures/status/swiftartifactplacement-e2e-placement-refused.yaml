      reason: Authorized
      preparedNodes: 0
      policies:
        - name: e2e-policy-signed
          generation: 1
    - name: legacy-data
      reason: PolicyDenied
      message: SwiftArtifactVerificationPolicy e2e-policy-invalid is not ready, so it refuses every artifact it governs.
      preparedNodes: 0
      policies:
        - name: e2e-policy-invalid
          generation: 1
  nodes:
