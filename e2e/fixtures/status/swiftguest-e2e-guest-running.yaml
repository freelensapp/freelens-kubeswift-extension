# Merge patch applied to the status subresource of swiftguest/e2e-guest-running.
# No KubeSwift controller runs in the E2E cluster, so the status a real
# controller would write is injected here instead.
#
# nodeName is __NODE_NAME__, substituted by cluster-up.sh's inject_statuses()
# with the real (single) node of whatever cluster this is applied to, instead
# of the literal "kubeswift-e2e-control-plane" kind would only give a cluster
# named "kubeswift-e2e" (E2E_CLUSTER_NAME). That value happens to still be
# correct for the E2E cluster itself, since kind names a single-node cluster's
# node "<cluster-name>-control-plane" (see docs/specs/SPEC-0001, issue #23).
status:
  phase: Running
  nodeName: __NODE_NAME__
  restartCount: 2
  lastRestartTime: "2026-08-27T08:30:00Z"
  network:
    primaryIP: 10.244.1.21
    ready: true
    interface: eth0
    interfaces:
      - name: eth0
        ip: 10.244.1.21
        # Quoted: unquoted, YAML reads a MAC address as a sexagesimal integer.
        mac: "52:54:00:12:34:56"
    exposedPorts:
      - name: ssh
        port: 22
        targetPort: 22
        protocol: TCP
    serviceRef:
      name: e2e-guest-running
  runtime:
    hypervisor: cloud-hypervisor
    pid: 4242
  storage:
    accessMode: ReadWriteOnce
    storageClassName: standard
    volumeMode: Block
  podRef:
    apiVersion: v1
    kind: Pod
    name: e2e-guest-running-launcher
    namespace: kubeswift-e2e
  console:
    serialSocket: /var/run/kubeswift/e2e-guest-running/serial.sock
  conditions:
    - type: Ready
      status: "True"
      reason: GuestRunning
      message: The guest is running.
      lastTransitionTime: "2026-08-27T08:30:00Z"
      observedGeneration: 1
