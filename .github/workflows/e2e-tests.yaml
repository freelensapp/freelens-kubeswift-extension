name: E2E tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test-e2e:
    name: "E2E tests with Freelens ${{ matrix.freelens_version }}"

    strategy:
      fail-fast: false
      matrix:
        include:
          - freelens_version: v1.10.3

    # Same runner as the integration workflow: kind needs a Docker daemon, and
    # that workflow already provisions a kind cluster here, so both Docker and
    # the arm64 Freelens build are known to work on this image.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    env:
      DO_NOT_TRACK: "1"
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      ELECTRON_HEADERS_CACHE: ${{ github.workspace }}/.cache/electron-headers
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
      TURBOREPO_CACHE: ${{ github.workspace }}/freelens/.turbo

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup pnpm
        run: corepack enable

      - name: Get pnpm cache directory
        run: echo "pnpm_cache_dir=$(pnpm store path)" >> ${GITHUB_ENV}

      - name: Use pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.pnpm_cache_dir }}
          key: node-freelens-${{ matrix.freelens_version }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            node-freelens-${{ matrix.freelens_version }}-

      - name: Install pnpm dependencies for extension
        id: install-pnpm-extension
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile
        continue-on-error: true

      - name: Install pnpm dependencies for extension (retry)
        if: steps.install-pnpm-extension.outcome == 'failure'
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile

      - name: Build plugin
        id: build-plugin
        run: pnpm build
        continue-on-error: true

      - name: Build plugin (retry)
        id: build-plugin-2
        if: steps.build-plugin.outcome == 'failure'
        run: pnpm build
        continue-on-error: true

      - name: Build plugin (retry 2)
        if: steps.build-plugin-2.outcome == 'failure'
        run: pnpm build

      - name: Pack plugin
        run: pnpm pack

      - name: Get extension path
        run: echo "EXTENSION_PATH=$(find $(pwd) -maxdepth 1 -name '*.tgz')" >> ${GITHUB_ENV}

      # kind and kubectl are installed from the versions pinned in
      # e2e/scripts/lib.sh, so the workflow and a developer machine agree.
      - name: Install kind and kubectl
        run: |
          set -euo pipefail
          # shellcheck source=e2e/scripts/lib.sh
          source e2e/scripts/lib.sh
          case "$(uname -m)" in
            aarch64 | arm64) arch=arm64 ;;
            *) arch=amd64 ;;
          esac
          curl -sSfL -o /tmp/kind "https://kind.sigs.k8s.io/dl/v${KIND_VERSION}/kind-linux-${arch}"
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          if ! command -v kubectl >/dev/null 2>&1; then
            curl -sSfL -o /tmp/kubectl "https://dl.k8s.io/release/v${KUBERNETES_VERSION}/bin/linux/${arch}/kubectl"
            sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          fi
          kind version
          kubectl version --client

      - name: Checkout app
        if: matrix.freelens_version != 'latest'
        uses: actions/checkout@v7
        with:
          repository: freelensapp/freelens
          ref: ${{ matrix.freelens_version }}
          path: freelens

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: freelens/.nvmrc
          package-manager-cache: false

      - name: Get Electron version
        run: echo "electron_version=$(yq -r .importers.freelens.devDependencies.electron.version freelens/pnpm-lock.yaml | sed 's/(.*)//')" >> $GITHUB_ENV

      - name: Get Electron Builder version
        run: echo "electron_builder_version=$(yq -r .importers.freelens.devDependencies.electron-builder.version freelens/pnpm-lock.yaml | sed 's/(.*)//')" >> $GITHUB_ENV

      - name: Get Playwright version
        run: echo "playwright_version=$(yq -r .importers.freelens.devDependencies.playwright.version freelens/pnpm-lock.yaml | sed 's/(.*)//')" >> $GITHUB_ENV

      - name: Use Electron cache
        uses: actions/cache@v6
        with:
          path: ${{ env.ELECTRON_CACHE }}
          key: ubuntu-24.04-arm-electron-${{ env.electron_version }}
          restore-keys: |
            ubuntu-24.04-arm-electron-

      - name: Use Electron Builder cache
        uses: actions/cache@v6
        with:
          path: ${{ env.ELECTRON_BUILDER_CACHE }}
          key: ubuntu-24.04-arm-electron-builder-${{ env.electron_builder_version }}
          restore-keys: |
            ubuntu-24.04-arm-electron-builder-

      - name: Use Electron headers cache
        id: electron-headers
        uses: actions/cache@v6
        with:
          path: ${{ env.ELECTRON_HEADERS_CACHE }}
          key: electron-headers-${{ env.electron_version }}

      - name: Use Playwright cache
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ubuntu-24.04-arm-playwright-${{ env.playwright_version }}
          restore-keys: |
            ubuntu-24.04-arm-playwright-

      - name: Use Turborepo cache
        uses: actions/cache@v6
        with:
          path: ${{ env.TURBOREPO_CACHE }}
          key: ubuntu-24.04-arm-turborepo-${{ hashFiles('freelens/**/package.json', 'freelens/**/pnpm-lock.yaml', 'freelens/turbo.json') }}
          restore-keys: |
            ubuntu-24.04-arm-turborepo-

      # The packaged app does not depend on the extension under test, so its
      # build output is deterministic for a given Freelens and Electron version.
      # The key matches the one of the integration workflow on purpose: both
      # workflows build the same app and share the cache entry.
      - name: Restore Electron build cache
        id: electron-build-cache
        uses: actions/cache/restore@v6
        with:
          path: freelens/freelens/dist
          key: ubuntu-24.04-arm-electron-dist-${{ matrix.freelens_version }}-${{ env.electron_version }}-${{ env.electron_builder_version }}

      - name: Delete node packages from the previous build to avoid issues with pnpm
        run: rm -rf pnpm-lock.yaml node_modules

      - name: Install pnpm dependencies for app
        id: install-pnpm-app
        working-directory: freelens
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        continue-on-error: true

      - name: Install pnpm dependencies for app (retry)
        if: steps.install-pnpm-app.outcome == 'failure'
        working-directory: freelens
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Disable pre post scripts for pnpm
        run: pnpm config set enablePrePostScripts false

      - name: Install Electron headers
        if: steps.electron-build-cache.outputs.cache-hit != 'true' && steps.electron-headers.outputs.cache-hit != 'true'
        run: |
          set -eo pipefail
          mkdir -p $ELECTRON_HEADERS_CACHE
          curl -sSfL https://www.electronjs.org/headers/v$electron_version/node-v$electron_version-headers.tar.gz -o $ELECTRON_HEADERS_CACHE/node-v$electron_version-headers.tar.gz

      - name: Install Playwright with dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: freelens
        run: pnpx playwright install --with-deps chromium

      - name: Install Playwright's dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: freelens
        run: pnpx playwright install-deps chromium

      - name: Build app
        if: steps.electron-build-cache.outputs.cache-hit != 'true'
        working-directory: freelens
        run: pnpm --color=always --stream build

      - name: Build extra resources
        id: build-resources
        if: steps.electron-build-cache.outputs.cache-hit != 'true'
        working-directory: freelens
        run: pnpm --color=always build:resources
        continue-on-error: true

      - name: Build extra resources (retry)
        id: build-resources-2
        if: steps.electron-build-cache.outputs.cache-hit != 'true' && steps.build-resources.outcome == 'failure'
        working-directory: freelens
        run: pnpm --color=always build:resources
        continue-on-error: true

      - name: Build extra resources (retry 2)
        if: steps.electron-build-cache.outputs.cache-hit != 'true' && steps.build-resources-2.outcome == 'failure'
        working-directory: freelens
        run: pnpm --color=always build:resources

      - name: Rebuild native packages for Electron
        if: steps.electron-build-cache.outputs.cache-hit != 'true'
        working-directory: freelens
        run: pnpm --color=always electron-rebuild -a arm64
        env:
          npm_package_config_node_gyp_tarball: ${{ env.ELECTRON_HEADERS_CACHE }}/node-v${{ env.electron_version }}-headers.tar.gz

      - name: Get electron-builder path
        if: steps.electron-build-cache.outputs.cache-hit != 'true'
        working-directory: freelens/freelens
        run: |
          EB_PATH=$(node -e "console.log(require.resolve('electron-builder/cli'))")
          echo "ELECTRON_BUILDER_PATH=$EB_PATH" >> $GITHUB_ENV

      - name: Deploy production node_modules
        if: steps.electron-build-cache.outputs.cache-hit != 'true'
        working-directory: freelens
        run: |
          pnpm deploy --legacy --prod --filter=freelens freelens/node_modules_prod
          mv freelens/node_modules freelens/node_modules_dev
          mv freelens/node_modules_prod freelens/node_modules

      - name: Build Electron app
        if: steps.electron-build-cache.outputs.cache-hit != 'true'
        working-directory: freelens/freelens
        run: node "$ELECTRON_BUILDER_PATH" --publish never --linux dir --arm64
        env:
          DEBUG: electron-builder,electron-builder:*
          npm_config_user_agent: pnpm

      - name: Save Electron build cache
        if: steps.electron-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: freelens/freelens/dist
          key: ${{ steps.electron-build-cache.outputs.cache-primary-key }}

      - name: Restore dev node_modules
        if: steps.electron-build-cache.outputs.cache-hit != 'true'
        working-directory: freelens
        run: |
          rm -rf freelens/node_modules
          mv freelens/node_modules_dev freelens/node_modules

      # Creates the kind cluster, applies the KubeSwift CRDs at the pinned
      # version and the fixtures, and injects their statuses.
      - name: Start the KubeSwift fixture cluster
        run: pnpm e2e:cluster:up

      - name: Run E2E tests
        id: e2e-tests
        run: |
          sudo chown root:root freelens/freelens/dist/linux*-unpacked/chrome-sandbox
          sudo chmod 4755 freelens/freelens/dist/linux*-unpacked/chrome-sandbox
          timeout 1200 ./e2e/scripts/run-suite.sh
        env:
          DEBUG: pw:browser
        continue-on-error: true

      # The retry above cannot reuse the cluster the first attempt ran against:
      # the M6 write cases mutate it. They patch run policies, delete launcher
      # pods, delete a guest outright and create SwiftSnapshots and
      # SwiftRestores, so once the suite has run the cluster no longer holds the
      # state its cases start from - and a single flake in one case would come
      # back as all twelve write cases failing on the retry, hiding the flake
      # that actually caused the rerun (issue #81).
      #
      # The cluster is thrown away and rebuilt rather than just re-applied.
      # cluster-up.sh is idempotent for everything it applies - a patched
      # `spec.runPolicy` is reset, a deleted guest or launcher pod comes back,
      # the statuses are injected again - but it only ever applies, it never
      # prunes. The objects the write cases CREATE carry a wall-clock timestamp
      # in their names, so they are in no fixture and would survive a re-apply,
      # accumulating on the very Snapshots and Restores lists the read-only
      # cases assert against. A fresh cluster is the only state that matches the
      # one the first attempt started from.
      #
      # This costs a kind delete and create, but only on the path that has
      # already failed once, and the node image is in the runner's Docker cache
      # by now. The job's 90 minute budget absorbs it.
      - name: Re-provision the KubeSwift fixture cluster before the retry
        if: steps.e2e-tests.outcome == 'failure'
        run: |
          pnpm e2e:cluster:down
          pnpm e2e:cluster:up

      - name: Run E2E tests (retry)
        if: steps.e2e-tests.outcome == 'failure'
        run: timeout 1200 ./e2e/scripts/run-suite.sh
        env:
          DEBUG: pw:browser

      - name: Upload the E2E screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots-${{ matrix.freelens_version }}
          path: e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Dump the cluster state
        if: failure()
        run: |
          kubectl --kubeconfig .e2e/kubeconfig --context kind-kubeswift-e2e get all,swiftguests,swiftguestclasses,swiftguestpools,swiftimages,swiftseedprofiles,swiftkernels --all-namespaces --output wide || true
          kubectl --kubeconfig .e2e/kubeconfig --context kind-kubeswift-e2e get swiftguests,swiftguestpools,swiftimages,swiftkernels --namespace kubeswift-e2e --output yaml || true

      - name: Delete the KubeSwift fixture cluster
        if: always()
        run: pnpm e2e:cluster:down
